<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RISE — Rocket Integrated Simulation Environment</title>
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      padding: 1.25rem 2rem;
      background: #1a1d27;
      border-bottom: 1px solid #2d3148;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    header h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: 0.05em; color: #a78bfa; }
    header span { font-size: 0.8rem; color: #64748b; }
    main {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 0;
      height: calc(100vh - 61px);
      overflow: hidden;
    }
    /* LEFT PANEL */
    .panel-left {
      background: #13161f;
      border-right: 1px solid #2d3148;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .panel-section { padding: 1.25rem; border-bottom: 1px solid #1e2235; }
    .panel-section h2 { font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.1em; color: #64748b; margin-bottom: 0.75rem; }
    textarea {
      width: 100%;
      height: 320px;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 6px;
      color: #e2e8f0;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 0.78rem;
      line-height: 1.6;
      padding: 0.75rem;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: #7c3aed; }
    button#run-btn {
      width: 100%;
      margin-top: 0.75rem;
      padding: 0.65rem 1rem;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 180ms;
    }
    button#run-btn:hover:not(:disabled) { background: #6d28d9; }
    button#run-btn:disabled { background: #3b2f6b; color: #6b6b9b; cursor: not-allowed; }
    #error-box {
      margin-top: 0.75rem;
      padding: 0.6rem 0.75rem;
      background: #2d1b1b;
      border: 1px solid #7f1d1d;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #fca5a5;
      display: none;
      white-space: pre-wrap;
    }
    /* RESULTS */
    .panel-right {
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .card {
      background: #13161f;
      border: 1px solid #2d3148;
      border-radius: 10px;
      padding: 1.25rem;
    }
    .card h2 { font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.1em; color: #64748b; margin-bottom: 1rem; }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }
    .kpi { background: #0f1117; border-radius: 8px; padding: 1rem; }
    .kpi .label { font-size: 0.72rem; color: #64748b; margin-bottom: 0.25rem; }
    .kpi .value { font-size: 1.5rem; font-weight: 700; color: #a78bfa; font-variant-numeric: tabular-nums; }
    .kpi .unit { font-size: 0.75rem; color: #475569; margin-top: 0.1rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    td, th { padding: 0.5rem 0.75rem; border-bottom: 1px solid #1e2235; }
    th { color: #64748b; font-weight: 500; text-align: left; width: 50%; }
    td { color: #cbd5e1; font-variant-numeric: tabular-nums; }
    .chart { width: 100%; height: 260px; }
    #welcome {
      margin: auto;
      text-align: center;
      color: #334155;
    }
    #welcome p { font-size: 0.9rem; margin-top: 0.5rem; }
    .tab-bar { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .tab {
      padding: 0.4rem 1rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      background: #1a1d27;
      color: #64748b;
      border: 1px solid #2d3148;
      transition: all 180ms;
    }
    .tab.active { background: #7c3aed; color: #fff; border-color: #7c3aed; }
  </style>
</head>
<body>

<header>
  <h1>RISE</h1>
  <span>Rocket Integrated Simulation Environment</span>
</header>

<main>
  <!-- LEFT: config input -->
  <div class="panel-left">
    <div class="panel-section">
      <h2>Engine Config (JSON)</h2>
      <textarea id="config-input" spellcheck="false" placeholder='{
  "name": "my-engine",
  "throat_area_m2": 0.0008,
  "exit_area_m2": 0.0048,
  "chamber_pressure_pa": 5000000,
  "ambient_pressure_pa": 101325,
  "mass_flow_kg_s": 1.8,
  "characteristic_length_m": 1.143,
  "contraction_ratio": 5.0,
  "convergent_half_angle_deg": 30,
  "divergent_half_angle_deg": 15,
  "nozzle_length_method": "80_percent_bell",
  "oxidizer": "LOX",
  "fuel": "LH2",
  "mixture_ratio": 5.5,
  "burn_time_s": 10,
  "time_step_s": 0.1,
  "propellant_mass_kg": 20
}'></textarea>
      <button id="run-btn">&#9654; Run Simulation</button>
      <div id="error-box"></div>
    </div>
  </div>

  <!-- RIGHT: results -->
  <div class="panel-right" id="results-panel">
    <div id="welcome">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="1.5">
        <path d="M12 2L8 7H4l4 5-2 5 6-3 6 3-2-5 4-5h-4L12 2z"/>
      </svg>
      <p>Paste a config and click Run Simulation</p>
    </div>
  </div>
</main>

<script>
const PLOTLY_LAYOUT = {
  paper_bgcolor: 'transparent',
  plot_bgcolor: '#0f1117',
  font: { color: '#94a3b8', size: 11 },
  margin: { t: 10, r: 16, b: 40, l: 56 },
  xaxis: { gridcolor: '#1e2235', linecolor: '#2d3148' },
  yaxis: { gridcolor: '#1e2235', linecolor: '#2d3148' },
};
const PLOTLY_CONFIG = { responsive: true, displayModeBar: false };

// ---- data fetching ----
async function runSimulation() {
  const btn = document.getElementById('run-btn');
  const errBox = document.getElementById('error-box');
  errBox.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Running…';

  let payload;
  try {
    payload = JSON.parse(document.getElementById('config-input').value);
  } catch {
    renderError('Invalid JSON — check your config syntax.');
    btn.disabled = false;
    btn.textContent = '\u25B6 Run Simulation';
    return;
  }

  try {
    const res = await fetch('/simulate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) {
      renderError(data.detail || 'Simulation failed.');
    } else {
      renderResults(data);
    }
  } catch (err) {
    renderError('Network error: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '\u25B6 Run Simulation';
  }
}

// ---- rendering ----
function renderError(msg) {
  const box = document.getElementById('error-box');
  box.textContent = msg;
  box.style.display = 'block';
}

function renderResults(data) {
  const panel = document.getElementById('results-panel');
  panel.innerHTML = '';

  // Tab bar (for future stages — single tab now)
  // ponytail: tab system ready for Stage 21 parametric tab
  const tabBar = document.createElement('div');
  tabBar.className = 'tab-bar';
  ['Simulation', 'Nozzle Diagram', 'Altitude'].forEach((label, i) => {
    const t = document.createElement('button');
    t.className = 'tab' + (i === 0 ? ' active' : '');
    t.textContent = label;
    t.dataset.tab = i;
    t.onclick = () => switchTab(i);
    tabBar.appendChild(t);
  });
  panel.appendChild(tabBar);

  // Tab 0: Simulation
  const tab0 = document.createElement('div');
  tab0.id = 'tab-0';
  tab0.innerHTML = buildSimulationTab(data);
  panel.appendChild(tab0);

  // Tab 1: Nozzle Diagram (filled by Stage 19)
  const tab1 = document.createElement('div');
  tab1.id = 'tab-1';
  tab1.style.display = 'none';
  if (data.nozzle_svg) {
    tab1.innerHTML = `<div class="card">${data.nozzle_svg}</div>`;
  } else {
    tab1.innerHTML = '<div class="card"><p style="color:#475569;font-size:.85rem">Nozzle diagram added in Stage 19.</p></div>';
  }
  panel.appendChild(tab1);

  // Tab 2: Altitude sweep (filled by Stage 20)
  const tab2 = document.createElement('div');
  tab2.id = 'tab-2';
  tab2.style.display = 'none';
  if (data.altitude_sweep && data.altitude_sweep.length) {
    tab2.innerHTML = buildAltitudeTab(data.altitude_sweep);
  } else {
    tab2.innerHTML = '<div class="card"><p style="color:#475569;font-size:.85rem">Add altitude_sweep_m to your config to see altitude performance.</p></div>';
  }
  panel.appendChild(tab2);

  // Render charts after DOM is set
  if (data.transient) renderTransientCharts(data.transient);
}

function switchTab(idx) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', i === idx);
  });
  [0, 1, 2].forEach(i => {
    const el = document.getElementById('tab-' + i);
    if (el) el.style.display = i === idx ? '' : 'none';
  });
}

function buildSimulationTab(data) {
  const g = data.geometry;
  const t = data.transient;
  return `
    <div class="card">
      <h2>Performance</h2>
      <div class="kpi-grid">
        <div class="kpi">
          <div class="label">Thrust</div>
          <div class="value">${(data.thrust_n / 1000).toFixed(2)}</div>
          <div class="unit">kN</div>
        </div>
        <div class="kpi">
          <div class="label">Specific Impulse</div>
          <div class="value">${data.specific_impulse_s.toFixed(1)}</div>
          <div class="unit">s</div>
        </div>
        <div class="kpi">
          <div class="label">Expansion Ratio</div>
          <div class="value">${data.expansion_ratio.toFixed(3)}</div>
          <div class="unit">ε</div>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>Geometry</h2>
      <table>
        <tr><th>Throat diameter</th><td>${(g.throat_diameter_m * 1000).toFixed(2)} mm</td></tr>
        <tr><th>Exit diameter</th><td>${(g.exit_diameter_m * 1000).toFixed(2)} mm</td></tr>
        <tr><th>Chamber diameter</th><td>${(g.chamber_diameter_m * 1000).toFixed(2)} mm</td></tr>
        <tr><th>Chamber length</th><td>${(g.chamber_length_m * 1000).toFixed(2)} mm</td></tr>
        <tr><th>Converging length</th><td>${(g.converging_length_m * 1000).toFixed(2)} mm</td></tr>
        <tr><th>Diverging length</th><td>${(g.diverging_length_m * 1000).toFixed(2)} mm</td></tr>
        <tr><th>Expansion ratio</th><td>${g.expansion_ratio.toFixed(3)}</td></tr>
      </table>
    </div>
    ${t ? `
    <div class="card">
      <h2>Transient — Chamber Pressure</h2>
      <div class="chart" id="chart-pressure"></div>
    </div>
    <div class="card">
      <h2>Transient — Thrust</h2>
      <div class="chart" id="chart-thrust"></div>
    </div>
    <div class="card">
      <h2>Transient — Mass Flow</h2>
      <div class="chart" id="chart-massflow"></div>
    </div>
    ` : ''}
  `;
}

function renderTransientCharts(t) {
  const color = '#a78bfa';
  Plotly.newPlot('chart-pressure',
    [{ x: t.time_s, y: t.chamber_pressure_pa.map(v => v / 1e6), mode: 'lines', line: { color } }],
    { ...PLOTLY_LAYOUT, yaxis: { ...PLOTLY_LAYOUT.yaxis, title: 'Pressure (MPa)' }, xaxis: { ...PLOTLY_LAYOUT.xaxis, title: 'Time (s)' } },
    PLOTLY_CONFIG
  );
  Plotly.newPlot('chart-thrust',
    [{ x: t.time_s, y: t.thrust_n.map(v => v / 1000), mode: 'lines', line: { color: '#34d399' } }],
    { ...PLOTLY_LAYOUT, yaxis: { ...PLOTLY_LAYOUT.yaxis, title: 'Thrust (kN)' }, xaxis: { ...PLOTLY_LAYOUT.xaxis, title: 'Time (s)' } },
    PLOTLY_CONFIG
  );
  Plotly.newPlot('chart-massflow',
    [{ x: t.time_s, y: t.mass_flow_kg_s, mode: 'lines', line: { color: '#f59e0b' } }],
    { ...PLOTLY_LAYOUT, yaxis: { ...PLOTLY_LAYOUT.yaxis, title: 'Mass Flow (kg/s)' }, xaxis: { ...PLOTLY_LAYOUT.xaxis, title: 'Time (s)' } },
    PLOTLY_CONFIG
  );
}

function buildAltitudeTab(sweep) {
  return `
    <div class="card">
      <h2>Altitude Performance</h2>
      <div class="chart" id="chart-altitude-thrust"></div>
    </div>
    <div class="card">
      <h2>Altitude — Specific Impulse</h2>
      <div class="chart" id="chart-altitude-isp"></div>
    </div>
    <script>
      const altData = ${JSON.stringify(sweep)};
      Plotly.newPlot('chart-altitude-thrust',
        [{ x: altData.map(d => d.altitude_m / 1000), y: altData.map(d => d.thrust_n / 1000), mode: 'lines', line: { color: '#a78bfa' } }],
        { ...PLOTLY_LAYOUT, xaxis: { ...PLOTLY_LAYOUT.xaxis, title: 'Altitude (km)' }, yaxis: { ...PLOTLY_LAYOUT.yaxis, title: 'Thrust (kN)' } },
        { responsive: true, displayModeBar: false }
      );
      Plotly.newPlot('chart-altitude-isp',
        [{ x: altData.map(d => d.altitude_m / 1000), y: altData.map(d => d.specific_impulse_s), mode: 'lines', line: { color: '#34d399' } }],
        { ...PLOTLY_LAYOUT, xaxis: { ...PLOTLY_LAYOUT.xaxis, title: 'Altitude (km)' }, yaxis: { ...PLOTLY_LAYOUT.yaxis, title: 'Isp (s)' } },
        { responsive: true, displayModeBar: false }
      );
    <\/script>
  `;
}

document.getElementById('run-btn').addEventListener('click', runSimulation);
</script>
</body>
</html>
